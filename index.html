<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宮崎卓己 | Portfolio</title>
<meta name="description" content="新卒でWeb開発職を目指す宮崎卓己のポートフォリオ。制作物を「課題・考えたこと・作ったもの・いまの状態」の順に紹介しています。">
<meta property="og:title" content="宮崎卓己 | Portfolio">
<meta property="og:description" content="新卒でWeb開発職を目指す宮崎卓己のポートフォリオ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://miyazakitakumi-724.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 全モック共通の土台。色や書体は各テーマで変数を上書きする */
*{ box-sizing: border-box; }
html, body{ height: 100%; margin: 0; }
body{
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: var(--font-body, sans-serif);
  -webkit-font-smoothing: antialiased;
}
button{ font: inherit; color: inherit; }
a{ color: inherit; }
:focus-visible{ outline: 2px solid var(--focus, var(--accent, #0060df)); outline-offset: 2px; }

#desktop{ position: relative; flex: 1; min-height: 0; overflow: hidden; }

/* ---------- デスクトップのアイコン ---------- */
#icons{
  position: absolute;
  top: 12px; left: 12px;
  z-index: 1;
  display: flex; flex-direction: column; flex-wrap: wrap;
  gap: 6px;
  max-height: calc(100% - 24px);
}
.dicon{
  appearance: none;
  background: none; border: 0; margin: 0;
  padding: 6px 4px;
  width: var(--icon-w, 92px);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
  text-align: center;
}
.dicon-img{ width: var(--icon-size, 40px); height: var(--icon-size, 40px); display: grid; place-items: center; }
.dicon-img svg{ width: 100%; height: 100%; }
.dicon-label{ font-size: 12.5px; line-height: 1.35; padding: 1px 4px; overflow-wrap: anywhere; }

.ic-paper{ fill: var(--icon-paper, #fff); }
.ic-acc{ fill: var(--icon-acc, #3a6fd8); }
.ic-acc2{ fill: var(--icon-acc2, #f2c94c); }
.ic-stroke{ stroke: var(--icon-ink, #000); stroke-width: 2; }
.ic-line{ fill: none; stroke: var(--icon-ink, #000); stroke-width: 2; }

/* ---------- ウィンドウ ---------- */
.win{
  position: absolute;
  display: flex; flex-direction: column;
  min-width: 240px;
  background: var(--win-bg, #fff);
  color: var(--win-fg, #111);
}
.win[hidden]{ display: none; }
.win.opening{ animation: win-in .18s ease-out; }
@keyframes win-in{ from{ opacity: 0; transform: scale(.97); } to{ opacity: 1; transform: none; } }
.win-bar{
  flex: none;
  display: flex; align-items: center; gap: 8px;
  user-select: none;
  touch-action: none;
  cursor: grab;
}
.win.dragging .win-bar{ cursor: grabbing; }
.win-title{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-ctrls{ flex: none; display: flex; gap: 4px; }
.win-btn{ appearance: none; margin: 0; padding: 0; cursor: pointer; }
.win-body{ flex: 1; min-height: 0; overflow: auto; container-type: inline-size; }
.win.max{ left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }

/* ---------- タイル型（並べて表示） ---------- */
.mode-tile{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: var(--gap, 8px);
  padding: var(--gap, 8px);
}
.mode-tile .win{ position: relative; min-height: 0; }
.mode-tile .win.max{ position: absolute; inset: var(--gap, 8px); z-index: 50; width: auto !important; height: auto !important; }

/* ---------- スマホ：ウィンドウは全画面 ---------- */
@media (max-width: 700px){
  .win{ left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 12px) !important; }
  .win-bar{ cursor: default; }
  .mode-tile{ grid-template-columns: 1fr; grid-auto-rows: minmax(72vh, auto); overflow: auto; }
  .mode-tile .win{ left: auto !important; top: auto !important; width: auto !important; height: auto !important; }
}

/* ---------- ウィンドウの中身 ---------- */
.c{
  padding: var(--pad, 22px);
  display: flex; flex-direction: column; gap: 14px;
  font-size: var(--fs, 15px);
  line-height: 1.85;
}
.c p, .c h2, .c h3, .c dl, .c ol, .c ul{ margin: 0; }
.c h2{ font-family: var(--font-head, inherit); font-size: var(--h2, 24px); font-weight: var(--h-weight, 900); line-height: 1.35; }
.c h3{ font-family: var(--font-head, inherit); font-size: 15px; font-weight: var(--h-weight, 900); margin-top: 6px; }
.c-kicker{ font-size: 13px; color: var(--accent-text, var(--accent)); font-weight: 700; }
.c-lead{ font-weight: 700; font-size: 1.08em; }
.c-list{ padding-left: 1.3em; }
.c-stack{ font-size: 13px; color: var(--muted); }
.c-dl{ display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.c-dl dt{ color: var(--muted); }
.c-dl dd{ margin: 0; }
.c-btns{ display: flex; flex-wrap: wrap; gap: 10px; }
.c-btn{
  display: inline-flex; align-items: center;
  min-height: 40px; padding: 0 16px;
  font-size: 14px; font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  color: var(--btn-fg, var(--win-fg));
  background: var(--btn-bg, transparent);
  border: var(--btn-border, 1.5px solid currentColor);
  border-radius: var(--btn-radius, 999px);
}
.c-btn-solid{
  background: var(--btn-solid-bg, var(--win-fg));
  color: var(--btn-solid-fg, var(--win-bg));
  border-color: var(--btn-solid-bg, var(--win-fg));
}
.c-split{ display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 22px; align-items: start; }
.c-col{ display: flex; flex-direction: column; gap: 14px; }
@container (max-width: 600px){ .c-split{ grid-template-columns: 1fr; } }
.c-mail a{ font-family: var(--font-mono, monospace); font-size: clamp(16px, 5cqi, 24px); font-weight: 700; overflow-wrap: anywhere; }
.c-progress{ list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: var(--muted); }
.c-progress li{ display: flex; flex-direction: column; gap: 6px; }
.c-progress li::before{ content: ""; height: 4px; background: var(--line); }
.c-progress li.now{ color: var(--accent-text, var(--accent)); font-weight: 700; }
.c-progress li.now::before{ background: var(--accent); }
.soon-box{ border: 1.5px dashed var(--line); padding: 28px; text-align: center; font-weight: 700; letter-spacing: .1em; color: var(--muted); }

/* 精算シミュレーター */
.sim{
  display: flex; flex-direction: column; gap: 10px;
  padding: 16px;
  background: var(--sim-bg, rgba(0,0,0,.04));
  border: var(--sim-border, 1px solid var(--line));
  border-radius: var(--sim-radius, 10px);
  font-size: 14px;
}
.sim p{ margin: 0; }
.sim-title{ font-weight: 700; text-align: center; }
.sim-hint{ font-size: 12px; color: var(--muted); text-align: center; }
.sim label{ display: flex; align-items: center; gap: 8px; }
.sim .who{ width: 40px; font-weight: 700; }
.sim input{
  flex: 1; min-width: 0; min-height: 36px; padding: 0 8px;
  font: inherit; font-family: var(--font-mono, monospace); font-size: 16px; text-align: right;
  color: var(--input-fg, var(--win-fg));
  background: var(--input-bg, transparent);
  border: var(--input-border, 1.5px solid var(--line));
  border-radius: var(--input-radius, 6px);
}
.sim-meta{ display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.sim-out{ display: flex; flex-direction: column; gap: 6px; }
.sim-tr{ display: flex; justify-content: space-between; font-weight: 700; }
.sim-tr .amt, .sim-ok{ color: var(--accent-text, var(--accent)); font-family: var(--font-mono, monospace); }
.sim-ok{ text-align: center; font-weight: 700; }

/* Pop の掲示板モック */
.pop{
  display: flex; flex-direction: column; gap: 8px;
  height: 232px; overflow: hidden;
  padding: 12px;
  background: var(--pop-bg, transparent);
  border: 1px solid var(--line);
  border-radius: var(--pop-radius, 12px);
}
.pop-tags{ display: flex; flex-wrap: wrap; gap: 6px; }
.pop-tag{
  min-height: 30px; padding: 0 11px;
  font-size: 12px; cursor: pointer;
  background: var(--tag-bg, transparent);
  border: 1px solid var(--line);
  border-radius: var(--tag-radius, 999px);
}
.pop-tag[aria-pressed="true"]{ background: var(--accent); border-color: var(--accent); color: var(--accent-fg, #fff); font-weight: 700; }
.pop-list{ display: flex; flex-direction: column; gap: 8px; }
.pop-item{
  display: flex; align-items: center; gap: 10px;
  padding: 7px 9px;
  background: var(--pop-item-bg, transparent);
  border: 1px solid var(--line);
  border-radius: var(--pop-radius-sm, 10px);
}
.pop-thumb{ width: 36px; height: 36px; flex: none; display: grid; place-items: center; font-weight: 900; border-radius: var(--thumb-radius, 7px); background: var(--accent); color: var(--accent-fg, #fff); }
.pop-meta{ min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pop-title{ font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-sub{ font-size: 11px; color: var(--muted); }
.pop-sub span{ margin-right: 6px; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation: none !important; transition: none !important; }
}
</style>
<style>
  :root{
    --blue: #1d4f91; --blue-deep: #143b70; --chalk: #f4f8ff; --ink: #10233f; --muted: #5a6b82; --line: #d5deea; --sel: #e3edfb;
    --font-body: 'IBM Plex Sans JP', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    --win-bg: #fff; --win-fg: var(--ink);
    --accent: #1d4f91; --accent-text: #1d4f91; --accent-fg: #fff;
    --focus: #f0b429;
    --btn-radius: 4px; --input-radius: 4px; --sim-radius: 4px; --pop-radius: 4px; --pop-radius-sm: 4px; --tag-radius: 4px; --thumb-radius: 4px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  body{ display: flex; flex-direction: column; background: var(--blue); color: var(--chalk); }
  #desktop{
    background:
      linear-gradient(rgba(255,255,255,.13) 1px, transparent 1px) 0 0 / 100px 100px,
      linear-gradient(90deg, rgba(255,255,255,.13) 1px, transparent 1px) 0 0 / 100px 100px,
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 20px 20px,
      var(--blue);
  }

  /* 図面の表題欄 */
  .title-block{ position: absolute; right: 18px; bottom: 18px; z-index: 0; display: grid; grid-template-columns: max-content 1fr; min-width: 330px; border: 1.5px solid var(--chalk); font-size: 13px; pointer-events: none; }
  .title-block > *{ padding: 6px 12px; border-bottom: 1px solid rgba(244,248,255,.5); }
  .title-block dt{ border-right: 1px solid rgba(244,248,255,.5); font-family: var(--font-mono); opacity: .8; }
  .title-block dd{ margin: 0; font-weight: 700; }
  .title-block dd.big{ font-size: 17px; }
  .title-block > :nth-last-child(-n+2){ border-bottom: 0; }

  /* デスクトップのアイコン：ポイントすると薄く光り、選ぶと枠が付く */
  #icons{ top: 24px; left: 20px; gap: 12px; }
  .dicon{ color: var(--chalk); border-radius: 6px; border: 1px solid transparent; transition: background-color .12s ease; }
  .dicon:hover{ background: rgba(255,255,255,.1); }
  .dicon.selected{ background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.45); }
  .dicon-img{ --icon-size: 52px; border: 1.5px dashed rgba(244,248,255,.7); border-radius: 6px; }
  .dicon-img svg{ width: 26px; height: 26px; }
  .dicon.selected .dicon-img{ border-style: solid; }

  /* ウィンドウ */
  .win{ border: 1.5px solid var(--blue-deep); border-radius: 8px; box-shadow: 0 12px 30px -18px rgba(5,15,35,.6); overflow: hidden; transition: box-shadow .2s ease; }
  .win.focused{ box-shadow: 0 30px 60px -22px rgba(5,15,35,.8), 0 0 0 1px rgba(255,255,255,.25); }
  .win.max{ border-radius: 0; }
  .win-bar{ height: 38px; padding: 0 0 0 14px; background: #eef3fa; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .win:not(.focused) .win-bar{ background: #f6f8fb; color: var(--muted); }
  .win-ctrls{ gap: 0; align-self: stretch; }
  .win-btn{ width: 46px; height: 100%; display: grid; place-items: center; font-size: 14px; background: none; border: 0; color: inherit; transition: background-color .1s ease, color .1s ease; }
  .win-btn:hover{ background: rgba(16,35,63,.08); }
  .win-btn:active{ background: rgba(16,35,63,.14); }
  .win-close:hover{ background: #c42b1c; color: #fff; }
  .win-close:active{ background: #a52417; color: #fff; }

  /* ドラッグで端に寄せたときの、スナップ先のプレビュー */
  .snap-preview{ position: absolute; z-index: 4000; border-radius: 8px; background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.65); box-shadow: inset 0 0 0 4px rgba(255,255,255,.08); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: left .18s var(--ease), top .18s var(--ease), width .18s var(--ease), height .18s var(--ease), opacity .15s ease; }
  .snap-preview.show{ opacity: 1; }

  /* 範囲選択の四角 */
  .marquee{ position: absolute; z-index: 2; border: 1px solid rgba(255,255,255,.85); background: rgba(255,255,255,.16); pointer-events: none; }

  /* 右クリックメニュー */
  .ctx{ position: fixed; z-index: 9000; min-width: 220px; padding: 4px; background: rgba(255,255,255,.97); color: var(--ink); border: 1px solid rgba(16,35,63,.12); border-radius: 8px; box-shadow: 0 16px 32px -12px rgba(5,15,35,.45); animation: ctx-in .14s var(--ease); }
  @keyframes ctx-in{ from{ opacity: 0; transform: translateY(-6px); } to{ opacity: 1; transform: none; } }
  .ctx-item{ display: flex; align-items: center; width: 100%; min-height: 34px; padding: 0 12px; background: none; border: 0; border-radius: 4px; font-size: 14px; text-align: left; cursor: pointer; }
  .ctx-item:hover, .ctx-item:focus-visible{ background: #eaf1fb; outline: none; }
  .ctx-sep{ height: 1px; margin: 4px 6px; background: var(--line); }

  /* タスクバー */
  #taskbar{ position: relative; z-index: 5000; flex: none; height: 50px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 12px; background: rgba(14,36,70,.92); border-top: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .tb-name{ font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dock{ display: flex; gap: 4px; }
  .dock-btn{ position: relative; width: 46px; height: 42px; display: grid; place-items: center; padding: 0; background: none; border: 0; border-radius: 6px; color: var(--chalk); cursor: pointer; transition: background-color .12s ease; }
  .dock-btn svg{ width: 22px; height: 22px; transition: transform .15s var(--ease); }
  .dock-btn:hover{ background: rgba(255,255,255,.1); }
  .dock-btn:active svg{ transform: scale(.86); }
  .dock-btn::after{ content: ""; position: absolute; left: 50%; bottom: 3px; width: 0; height: 3px; border-radius: 3px; background: rgba(244,248,255,.7); transform: translateX(-50%); transition: width .2s var(--ease), background-color .2s ease; }
  .dock-btn.open::after{ width: 6px; }
  .dock-btn.active{ background: rgba(255,255,255,.12); }
  .dock-btn.active::after{ width: 18px; background: #7fb3ff; }
  .tip{ position: absolute; left: 50%; bottom: calc(100% + 10px); padding: 5px 10px; border-radius: 6px; background: rgba(250,251,253,.97); color: var(--ink); font-size: 12.5px; white-space: nowrap; box-shadow: 0 8px 18px -8px rgba(0,0,0,.4); opacity: 0; transform: translate(-50%, 4px); pointer-events: none; transition: opacity .12s ease, transform .12s ease; }
  .dock-btn:hover .tip, .dock-btn:focus-visible .tip{ opacity: 1; transform: translate(-50%, 0); transition-delay: .45s; }
  .tray{ justify-self: end; display: flex; flex-direction: column; align-items: flex-end; padding: 2px 8px; border-radius: 6px; font-size: 12px; line-height: 1.35; }
  .tray:hover{ background: rgba(255,255,255,.08); }

  /* 起動したときの流れ：タスクバーが上がってきて、アイコンが順に出る */
  .boot #taskbar{ animation: bar-up .45s var(--ease) both; }
  .boot .dicon{ animation: icon-in .4s var(--ease) both; animation-delay: calc(.25s + var(--i) * .07s); }
  @keyframes bar-up{ from{ transform: translateY(100%); } to{ transform: none; } }
  @keyframes icon-in{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: none; } }

  /* ファイルブラウザ */
  .fx{ height: 100%; display: grid; grid-template-columns: 190px 230px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .fx-path{ grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .fx-path b{ color: var(--ink); font-weight: 500; }
  .fx-side, .fx-files{ overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .fx-side{ background: #f7f9fc; }
  .fx-side .grp{ padding: 8px 8px 4px; font-size: 12px; color: var(--muted); }
  .fx-item{ position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 4px 8px; background: none; border: 0; border-radius: 4px; text-align: left; font-size: 14px; cursor: pointer; transition: background-color .1s ease; }
  .fx-item svg{ width: 17px; height: 17px; flex: none; color: var(--blue); }
  .fx-item:hover{ background: #eef3fa; }
  .fx-item[aria-selected="true"]{ background: var(--sel); font-weight: 700; }
  .fx-item[aria-selected="true"]::before{ content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--blue); }
  .fx-files .fx-item{ font-family: var(--font-mono); font-size: 13px; }
  .fx-preview{ overflow-y: auto; padding: 22px 26px 30px; }
  .doc{ display: flex; flex-direction: column; gap: 12px; max-width: 62ch; font-size: 15px; line-height: 1.85; animation: doc-in .2s var(--ease); }
  @keyframes doc-in{ from{ opacity: 0; transform: translateY(6px); } to{ opacity: 1; transform: none; } }
  .doc > *{ margin: 0; }
  .doc .kicker{ font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
  .doc h2{ font-size: 24px; line-height: 1.4; }
  .doc .kv, .doc .cs-who{ display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  .doc .kv dt, .doc .cs-who dt{ color: var(--blue); font-weight: 700; }
  .doc dd{ margin: 0; }
  .doc .cs-who{ padding: 12px 14px; border-left: 3px solid var(--blue); background: #f5f8fd; }
  .doc .cs-so{ font-size: 13px; color: var(--muted); font-weight: 700; }
  .doc .cs-points{ padding-left: 1.2em; margin: 0; }
  .doc .cs-points li + li{ margin-top: 4px; }
  .doc .next{ font-size: 13.5px; color: var(--muted); }
  .doc .next button{ background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; cursor: pointer; font: inherit; }
  .doc .mail{ font-family: var(--font-mono); font-size: clamp(17px, 4cqi, 24px); font-weight: 600; overflow-wrap: anywhere; }
  .c-btn{ min-height: 38px; transition: background-color .12s ease, color .12s ease; }
  .c-btn:not(.c-btn-solid):hover{ background: #eef3fa; }

  @container (max-width: 720px){
    .fx{ grid-template-columns: 1fr; grid-template-rows: auto auto auto minmax(0, 1fr); }
    .fx-side, .fx-files{ flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .fx-side .grp{ display: none; }
    .fx-item{ width: auto; flex: none; }
    .fx-item[aria-selected="true"]::before{ left: 9px; right: 9px; top: auto; bottom: 2px; width: auto; height: 3px; }
    .fx-preview{ padding: 18px 18px 26px; }
  }
  @media (max-width: 700px){
    .title-block{ left: 12px; right: 12px; bottom: 12px; min-width: 0; font-size: 12.5px; }
    #taskbar{ grid-template-columns: auto 1fr; }
    .tb-name{ display: none; }
    #dock{ justify-self: start; }
  }
</style>
</head>
<body>
  <main id="desktop">
    <div id="icons"></div>
    <dl class="title-block" aria-label="表題欄">
      <dt>図面名</dt><dd class="big">ポートフォリオ</dd>
      <dt>設計</dt><dd>宮崎 卓己</dd>

  // ---- 精算の計算（アプリ本体と同じ貪欲法） ----
  function settle(paid, names){
    const total = paid.reduce((s, v) => s + v, 0);
    const share = paid.length ? total / paid.length : 0;
    const bal = names.map((n, i) => ({ n, v: paid[i] - share }));
    const transfers = [];
    for (let g = 0; g < 50; g++){
      bal.sort((a, b) => b.v - a.v);
      const cr = bal[0], db = bal[bal.length - 1];
      if (!cr || cr.v < 1 || db.v > -1) break;
      const amt = Math.min(cr.v, -db.v);
      transfers.push({ from: db.n, to: cr.n, amt });
      cr.v -= amt; db.v += amt;
    }
    return { total, share, transfers };
  }
  const yen = (n) => '¥' + Math.round(n).toLocaleString('ja-JP');

          root.querySelector('[data-share]').textContent = '1人 ' + yen(r.share);
          out.replaceChildren();
          if (!r.transfers.length){
            const ok = document.createElement('p');
            ok.className = 'sim-ok';
            ok.textContent = '精算は不要です';
            out.appendChild(ok);
            return;

            const row = document.createElement('p');
            row.className = 'sim-tr';
            const l = document.createElement('span');
            l.textContent = t.from + ' → ' + t.to;
            const a = document.createElement('span');
            a.className = 'amt';
            a.textContent = yen(t.amt);
            row.append(l, a);
            out.appendChild(row);
          });
        }
        inputs.forEach((el) => el.addEventListener('input', render));
        render();
      }
    },
    pop: {
      html: () => `
        <div class="pop" aria-label="Popの掲示板イメージ（ダミーデータ）">
          <div class="pop-tags" data-tags></div>
          <div class="pop-list" data-list></div>
        </div>`,
      init(root){
        const tagsEl = root.querySelector('[data-tags]');
        const listEl = root.querySelector('[data-list]');
        let current = 'すべて';
        function render(){
          listEl.replaceChildren();
          POPS.filter((p) => current === 'すべて' || p.tags.includes(current)).slice(0, 3).forEach((p) => {
            const item = document.createElement('div');

            meta.append(title, sub);
            item.append(thumb, meta);
            listEl.appendChild(item);
          });
        }
        POP_TAGS.forEach((t) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'pop-tag';
          b.textContent = t === 'すべて' ? t : '#' + t;
          b.setAttribute('aria-pressed', String(t === current));
          b.addEventListener('click', () => {
            current = t;
            tagsEl.querySelectorAll('.pop-tag').forEach((el) => el.setAttribute('aria-pressed', String(el === b)));
            render();
          });
          tagsEl.appendChild(b);
        });
        render();
      }
    }
  };

  // ケーススタディの1ステップをHTMLにする

    if (step.widget) h += '<div class="cs-widget" data-widget="' + step.widget + '">' + WIDGETS[step.widget].html() + '</div>';
    return h;
  }
  function linksHTML(c, cls){
    return c.links.map((l, i) => '<a class="' + cls + (i === 0 ? ' is-primary' : '') + '" href="' + l.href + '" target="_blank" rel="noopener">' + l.label + ' ↗</a>').join('');
  }
  // data-widget の中身を動かす

  function explorer(root){
    root.innerHTML = '<div class="fx"><div class="fx-path" data-path></div><nav class="fx-side" aria-label="フォルダ" data-side></nav><div class="fx-files" role="listbox" aria-label="ファイル" data-files></div><div class="fx-preview" data-preview></div></div>';
    const side = root.querySelector('[data-side]'), files = root.querySelector('[data-files]'), preview = root.querySelector('[data-preview]'), path = root.querySelector('[data-path]');
    let fi = 0, gi = null;
    folders.forEach((f, i) => {
      if (f.group && f.group !== gi){ gi = f.group; side.insertAdjacentHTML('beforeend', '<span class="grp">' + f.group + '</span>'); }
      else if (!f.group && gi){ gi = null; side.insertAdjacentHTML('beforeend', '<span class="grp">その他</span>'); }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'fx-item'; b.dataset.folder = i;
      b.innerHTML = ICON.folder + '<span></span>';
      b.querySelector('span').textContent = f.name;
      b.addEventListener('click', () => openFolder(i));
      side.appendChild(b);
    });
    function openFolder(i, file){
      fi = i;
      side.querySelectorAll('[data-folder]').forEach((b) => b.setAttribute('aria-selected', String(Number(b.dataset.folder) === i)));

        b.addEventListener('click', () => openFile(k));
        files.appendChild(b);
      });
      openFile(file || 0);
    }
    function openFile(k){
      const f = folders[fi], file = f.files[k];
      files.querySelectorAll('[data-file]').forEach((b) => b.setAttribute('aria-selected', String(Number(b.dataset.file) === k)));
      path.innerHTML = 'ポートフォリオ › ' + f.name + ' › <b></b>';
      path.querySelector('b').textContent = file.name;
      const nxt = f.files[k + 1];
      preview.innerHTML = '<div class="doc">' + file.html() + (nxt ? '<p class="next">次のファイル：<button type="button" data-nextfile>' + nxt.name + '</button></p>' : '') + '</div>';
      preview.scrollTop = 0;
      const nb = preview.querySelector('[data-nextfile]');
      if (nb) nb.addEventListener('click', () => openFile(k + 1));
      mountWidgets(preview);
    }
    root.openFolder = (id, file) => openFolder(Math.max(0, folders.findIndex((f) => f.id === id)), file);
    root.openFolder('travel', 0);

  const touch = window.matchMedia('(pointer: coarse)').matches;

    },

    app2: '<path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 10h8"/>',
    folder: '<path d="M3 6h6l2 2h10v11H3z"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'
  };
  const pixelIcon = (kind) => '<svg viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true">' + (PIXEL[kind] || '') + '</svg>';
  const lineIcon = (kind) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (LINE[kind] || '') + '</svg>';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const appById = (id) => P.apps.find((a) => a.id === id);
  const iconHtml = (app) => (cfg.icon ? cfg.icon(app) : pixelIcon(app.kind));
  const animOn = () => cfg.anim && !reduceMotion;
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---- アニメーションの部品 ----
  const EASE_OUT = 'cubic-bezier(.2,.8,.2,1)';
  const EASE_IN = 'cubic-bezier(.4,0,1,1)';
  // to の位置にある要素を、from の位置・大きさに見せる transform
  function mapRect(from, to){
    return 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px) scale(' + (from.width / to.width) + ',' + (from.height / to.height) + ')';
  }
  function play(w, frames, opts){
    w.style.transformOrigin = '0 0';
    const a = w.animate(frames, opts);
    a.onfinish = a.oncancel = () => { w.style.transformOrigin = ''; };
    return a;
  }
  // 起動元（アイコンやタスクバーのボタン）から広がって開く
  function growFrom(w, from, startOpacity){
    const to = w.getBoundingClientRect();
    if (!from || !to.width){
      return play(w, [{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 180, easing: EASE_OUT });
    }
    return play(w, [{ opacity: startOpacity, transform: mapRect(from, to) }, { opacity: 1, transform: 'none' }], { duration: 240, easing: EASE_OUT });
  }
  // 位置や大きさが変わるとき、前の見た目からなめらかにつなぐ
  function morph(w, change){
    if (!animOn()){ change(); return; }
    const first = w.getBoundingClientRect();
    change();
    const last = w.getBoundingClientRect();
    if (!last.width) return;
    play(w, [{ transform: mapRect(first, last) }, { transform: 'none' }], { duration: 200, easing: EASE_OUT });
  }
  // タスクバー（Dock）上のボタンの位置
  function barRect(id){
    const b = (cfg.dock && document.querySelector(cfg.dock + ' [data-dock="' + id + '"]')) ||
              (cfg.taskbar && document.querySelector(cfg.taskbar + ' [data-app="' + id + '"]'));
    return b ? b.getBoundingClientRect() : null;
  }

  function boot(options){
    cfg = Object.assign({
      desktop: '#desktop',
      icons: '#icons',
      taskbar: null,
      dock: null,
      dockToggle: false,
      mode: 'float',
      controls: ['min', 'max', 'close'],
      controlLabels: { min: '–', max: '□', close: '×' },
      open: [],
      icon: null,
      title: null,
      cascade: { x: 120, y: 28 },
      anim: false,
      snap: false,
      marquee: false,
      contextMenu: null
    }, options);
    cfg.desktopEl = document.querySelector(cfg.desktop);
    if (cfg.mode === 'tile') cfg.desktopEl.classList.add('mode-tile');
    document.documentElement.classList.toggle('is-touch', coarse);

    renderIcons();
    renderDock();

    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-open]');
      if (!t) return;
      e.preventDefault();
      const id = t.dataset.open;
      const w = wins.get(id);
      // タスクバーのボタン：前面のウィンドウなら最小化、それ以外なら開く・戻す
      if (cfg.dockToggle && t.dataset.dock && w && !w.hidden && w.classList.contains('focused')){ minimize(id); return; }
      launchFrom = t.getBoundingClientRect();
      open(id);
      if (cfg.onLaunch) cfg.onLaunch(id);
    });
    cfg.desktopEl.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.dicon') && !e.target.closest('.win')) selectIcon(null);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (closeMenu()) return;
      const f = focused();
      if (f) close(f.dataset.app);
    });
    if (cfg.marquee) bindMarquee();
    if (cfg.contextMenu) bindContextMenu();

    tickClock();
    setInterval(tickClock, 10000);
    // スマホではウィンドウが全画面になるため、最初はデスクトップを見せる
    const initial = mqSmall.matches && cfg.mode === 'float' ? [] : cfg.open;
    initial.forEach((o) => (typeof o === 'string' ? open(o) : open(o.id, o)));
    updateBars();
  }

  // ---- デスクトップのアイコン ----
  function renderIcons(){
    const wrap = cfg.icons && document.querySelector(cfg.icons);
    if (!wrap) return;
    const apps = cfg.iconApps ? cfg.iconApps.map(appById) : P.apps;
    apps.forEach((app, i) => {
      const b = el('button', 'dicon');
      b.type = 'button';
      b.dataset.app = app.id;
      b.style.setProperty('--i', i);
      b.innerHTML = '<span class="dicon-img">' + iconHtml(app) + '</span><span class="dicon-label"></span>';
      b.querySelector('.dicon-label').textContent = app.label;
      b.setAttribute('aria-label', app.label + 'を開く');
      const launch = () => { launchFrom = b.getBoundingClientRect(); open(app.id); };
      b.addEventListener('click', () => { selectIcon(b); if (coarse) launch(); });
      b.addEventListener('dblclick', launch);
      b.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); launch(); }
      });
      wrap.appendChild(b);
    });
  }
  function selectIcon(b){
    document.querySelectorAll('.dicon.selected').forEach((x) => x.classList.remove('selected'));
    if (b) b.classList.add('selected');
  }

  // ---- 範囲選択（デスクトップの何もない所をドラッグ） ----
  function bindMarquee(){
    const D = cfg.desktopEl;
    D.addEventListener('pointerdown', (e) => {
      if (coarse || mqSmall.matches || e.button !== 0) return;
      if (e.target.closest('.dicon, .win, button, a, input')) return;
      e.preventDefault();
      const box = D.getBoundingClientRect();
      const sx = e.clientX - box.left, sy = e.clientY - box.top;
      const m = el('div', 'marquee');
      m.setAttribute('aria-hidden', 'true');
      D.appendChild(m);
      D.setPointerCapture(e.pointerId);
      const icons = Array.from(D.querySelectorAll('.dicon'));
      const move = (ev) => {
        const x = clamp(ev.clientX - box.left, 0, box.width), y = clamp(ev.clientY - box.top, 0, box.height);
        const l = Math.min(sx, x), t = Math.min(sy, y), w = Math.abs(x - sx), h = Math.abs(y - sy);
        Object.assign(m.style, { left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px' });
        const sel = { left: l + box.left, top: t + box.top, right: l + w + box.left, bottom: t + h + box.top };
        icons.forEach((ic) => {
          const r = ic.getBoundingClientRect();
          ic.classList.toggle('selected', r.left < sel.right && r.right > sel.left && r.top < sel.bottom && r.bottom > sel.top);
        });
      };
      const up = () => {
        m.remove();
        D.removeEventListener('pointermove', move);
        D.removeEventListener('pointerup', up);
        D.removeEventListener('pointercancel', up);
      };
      D.addEventListener('pointermove', move);
      D.addEventListener('pointerup', up);
      D.addEventListener('pointercancel', up);
    });
  }

  // ---- 右クリックメニュー ----
  let menuEl = null;
  function closeMenu(){
    if (!menuEl) return false;
    menuEl.remove();
    menuEl = null;
    return true;
  }
  function bindContextMenu(){
    cfg.desktopEl.addEventListener('contextmenu', (e) => {
      if (e.target.closest('.win')) return;
      e.preventDefault();
      closeMenu();
      menuEl = el('div', 'ctx');
      menuEl.setAttribute('role', 'menu');
      cfg.contextMenu.forEach((item) => {
        if (item.sep){ menuEl.appendChild(el('div', 'ctx-sep')); return; }
        const b = el('button', 'ctx-item', item.label);
        b.type = 'button';
        b.setAttribute('role', 'menuitem');
        b.addEventListener('click', () => {
          closeMenu();
          if (item.open){ launchFrom = { left: e.clientX, top: e.clientY, width: 1, height: 1 }; open(item.open); }
          if (item.action === 'refresh') refreshIcons();
          if (typeof item.action === 'function') item.action();
        });
        menuEl.appendChild(b);
      });
      document.body.appendChild(menuEl);
      const r = menuEl.getBoundingClientRect();
      menuEl.style.left = clamp(e.clientX, 4, window.innerWidth - r.width - 4) + 'px';
      menuEl.style.top = clamp(e.clientY, 4, window.innerHeight - r.height - 4) + 'px';
      const items = Array.from(menuEl.querySelectorAll('.ctx-item'));
      items[0].focus({ preventScroll: true });
      menuEl.addEventListener('keydown', (ev) => {
        const i = items.indexOf(document.activeElement);
        if (ev.key === 'ArrowDown'){ ev.preventDefault(); items[(i + 1) % items.length].focus(); }
        if (ev.key === 'ArrowUp'){ ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      });
    });
    document.addEventListener('pointerdown', (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
    window.addEventListener('blur', closeMenu);
    window.addEventListener('resize', closeMenu);
  }
  // 「最新の情報に更新」：アイコンが一瞬消えて、また表示される
  function refreshIcons(){
    const wrap = cfg.icons && document.querySelector(cfg.icons);
    if (!wrap || reduceMotion) return;
    wrap.animate([{ opacity: 1 }, { opacity: 0, offset: .3 }, { opacity: 0, offset: .55 }, { opacity: 1 }], { duration: 420 });
  }

  // ---- Dock（全アプリの起動ボタン） ----
  function renderDock(){
    const wrap = cfg.dock && document.querySelector(cfg.dock);
    if (!wrap) return;
    const apps = cfg.dockApps ? cfg.dockApps.map(appById) : P.apps;
    apps.forEach((app) => {
      const b = el('button', 'dock-btn');
      b.type = 'button';
      b.dataset.open = app.id;
      b.dataset.dock = app.id;
      b.setAttribute('aria-label', app.label + 'を開く');
      b.innerHTML = cfg.dockItem ? cfg.dockItem(app) : iconHtml(app);
      wrap.appendChild(b);
    });
  }

  // ---- スナップ（画面の端までドラッグすると、半分・全画面に合わせる） ----
  let snapEl = null;
  function snapZone(ev, D){
    if (ev.clientX <= D.left + 6) return 'left';
    if (ev.clientX >= D.right - 6) return 'right';
    if (ev.clientY <= D.top + 4) return 'top';
    return null;
  }
  function snapGeom(zone, D){
    if (zone === 'left') return { left: 0, top: 0, width: D.width / 2, height: D.height };
    if (zone === 'right') return { left: D.width / 2, top: 0, width: D.width / 2, height: D.height };
    return { left: 0, top: 0, width: D.width, height: D.height };
  }
  function showSnap(zone, D, ev){
    if (!zone){ if (snapEl) snapEl.classList.remove('show'); return; }
    if (!snapEl){ snapEl = el('div', 'snap-preview'); snapEl.setAttribute('aria-hidden', 'true'); cfg.desktopEl.appendChild(snapEl); }
    if (snapEl.dataset.zone === zone && snapEl.classList.contains('show')) return;
    const g = snapGeom(zone, D);
    if (!snapEl.classList.contains('show') && animOn()){
      // ポインタの位置から広がる
      snapEl.style.transition = 'none';
      Object.assign(snapEl.style, { left: (ev.clientX - D.left) + 'px', top: (ev.clientY - D.top) + 'px', width: '0px', height: '0px' });
      void snapEl.offsetWidth;
      snapEl.style.transition = '';
    }
    snapEl.dataset.zone = zone;
    Object.assign(snapEl.style, { left: g.left + 'px', top: g.top + 'px', width: g.width + 'px', height: g.height + 'px' });
    snapEl.classList.add('show');
  }
  function applySnap(w, zone, D){
    if (zone === 'top'){ if (!w.classList.contains('max')) toggleMax(w); return; }
    const g = snapGeom(zone, D);
    if (!w._restore) w._restore = { w: w.style.width, h: w.style.height };
    morph(w, () => Object.assign(w.style, { left: g.left + 'px', top: g.top + 'px', width: g.width + 'px', height: g.height + 'px' }));
  }

  // ---- ウィンドウ ----
  function open(id, pos, from){
    const app = appById(id);
    if (!app) return null;
    const src = from || launchFrom;
    launchFrom = null;
    let w = wins.get(id);
    if (w){
      const wasHidden = w.hidden || w.classList.contains('minimizing');
      w.getAnimations().forEach((a) => a.cancel());
      w.classList.remove('minimizing');
      w.hidden = false;
      focus(w);
      if (wasHidden && animOn()) growFrom(w, barRect(id) || src, .3);
      return w;
    }
    w = el('section', animOn() ? 'win' : 'win opening');
    w.dataset.app = id;
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-label', app.title);

    const bar = el('header', 'win-bar');
    const title = el('span', 'win-title', cfg.title ? cfg.title(app) : app.title);
    const ctrls = el('span', 'win-ctrls');
    cfg.controls.forEach((act) => {
      const b = el('button', 'win-btn win-' + act);
      b.type = 'button';
      b.dataset.act = act;
      b.setAttribute('aria-label', { min: '最小化', max: '最大化', close: '閉じる' }[act]);
      b.innerHTML = '<span aria-hidden="true">' + cfg.controlLabels[act] + '</span>';
      ctrls.appendChild(b);
    });
    bar.append(title, ctrls);

    const body = el('div', 'win-body');
    body.innerHTML = P.html[id]();
    w.append(bar, body);

    if (cfg.mode === 'float'){
      const D = cfg.desktopEl.getBoundingClientRect();
      const ww = Math.min((pos && pos.w) || app.w, D.width - 16);
      const hh = Math.min((pos && pos.h) || app.h, D.height - 16);
      let x, y;
      if (pos && pos.x != null){ x = D.width * pos.x; y = D.height * pos.y; }
      else { const k = opened % 6; x = cfg.cascade.x + k * 34; y = cfg.cascade.y + k * 30; }
      x = clamp(x, 8, Math.max(8, D.width - ww - 8));
      y = clamp(y, 8, Math.max(8, D.height - hh - 8));
      Object.assign(w.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px' });
    }
    opened++;
    cfg.desktopEl.appendChild(w);
    wins.set(id, w);
    bindWindow(w, bar);
    if (P.init[id]) P.init[id](body);
    focus(w);
    if (animOn()) growFrom(w, src, 0);
    else setTimeout(() => w.classList.remove('opening'), 300);
    return w;
  }

  function bindWindow(w, bar){
    w.addEventListener('pointerdown', () => { if (!w.classList.contains('focused')) focus(w); });
    bar.addEventListener('click', (e) => {
      const b = e.target.closest('.win-btn');
      if (!b) return;
      const id = w.dataset.app;
      if (b.dataset.act === 'close') close(id);
      else if (b.dataset.act === 'min') minimize(id);
      else toggleMax(w);
    });
    bar.addEventListener('dblclick', (e) => { if (!e.target.closest('.win-btn')) toggleMax(w); });
    bar.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('.win-btn')) return;
      if (cfg.mode !== 'float' || mqSmall.matches) return;
      if (w.classList.contains('max') && !cfg.snap) return;
      const sx = e.clientX, sy = e.clientY;
      let ox = w.offsetLeft, oy = w.offsetTop, started = false, zone = null, D = null;
      bar.setPointerCapture(e.pointerId);
      const move = (ev) => {
        if (!started){
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 4) return;
          started = true;
          D = cfg.desktopEl.getBoundingClientRect();
          w.classList.add('dragging');
          // 最大化・スナップ中のウィンドウは、元の大きさに戻してからつかむ
          if (w.classList.contains('max') || w._restore){
            const r = w.getBoundingClientRect();
            const ratio = (sx - r.left) / r.width;
            w.classList.remove('max');
            setMaxLabel(w);
            if (w._restore){ w.style.width = w._restore.w; w.style.height = w._restore.h; w._restore = null; }
            ox = (sx - D.left) - w.offsetWidth * ratio;
            oy = (sy - D.top) - bar.offsetHeight / 2;
          }
        }
        w.style.left = clamp(ox + ev.clientX - sx, 80 - w.offsetWidth, D.width - 80) + 'px';
        w.style.top = clamp(oy + ev.clientY - sy, 0, D.height - 36) + 'px';
        if (cfg.snap){ zone = snapZone(ev, D); showSnap(zone, D, ev); }
      };
      const up = () => {
        w.classList.remove('dragging');
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
        bar.removeEventListener('pointercancel', up);
        if (started && zone) applySnap(w, zone, D);
        if (snapEl) snapEl.classList.remove('show');
      };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
      bar.addEventListener('pointercancel', up);
    });
  }

  function focus(w){
    wins.forEach((o) => o.classList.remove('focused'));
    w.classList.add('focused');
    w.style.zIndex = ++z;
    updateBars();
  }
  const isShown = (w) => !w.hidden && !w.classList.contains('minimizing');
  function focused(){
    let f = null;
    wins.forEach((w) => { if (w.classList.contains('focused') && isShown(w)) f = w; });
    return f;
  }
  function focusTop(){
    let top = null;
    wins.forEach((w) => { if (isShown(w) && (!top || Number(w.style.zIndex) > Number(top.style.zIndex))) top = w; });
    if (top) focus(top);
    else { wins.forEach((o) => o.classList.remove('focused')); updateBars(); }
  }
  function close(id){
    const w = wins.get(id);
    if (!w) return;
    wins.delete(id);
    if (animOn() && !w.hidden){
      w.style.pointerEvents = 'none';
      play(w, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.95)' }], { duration: 150, easing: EASE_IN, fill: 'forwards' }).onfinish = () => w.remove();
      w.style.transformOrigin = '50% 50%';
      // アニメーションが止まっても（裏のタブなど）必ず消す
      setTimeout(() => w.remove(), 260);
    } else {
      w.remove();
    }
    focusTop();
  }
  function minimize(id){
    if (!cfg.taskbar && !cfg.dock){ close(id); return; }
    const w = wins.get(id);
    if (!w || !isShown(w)) return;
    w.classList.remove('focused');
    const target = barRect(id);
    if (animOn() && target){
      w.classList.add('minimizing');
      const from = w.getBoundingClientRect();
      const a = play(w, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: mapRect(target, from) }], { duration: 230, easing: EASE_IN, fill: 'forwards' });
      const done = () => {
        if (!w.classList.contains('minimizing')) return;
        w.classList.remove('minimizing');
        w.hidden = true;
        a.cancel();
        w.style.transformOrigin = '';
      };
      a.onfinish = done;
      // アニメーションが止まっても（裏のタブなど）必ず隠す
      setTimeout(done, 340);
    } else {
      w.hidden = true;
    }
    focusTop();
  }
  function setMaxLabel(w){
    const b = w.querySelector('.win-max');
    if (!b) return;
    const on = w.classList.contains('max');
    b.setAttribute('aria-label', on ? '元のサイズに戻す' : '最大化');
    if (cfg.controlLabels.restore) b.querySelector('span').textContent = on ? cfg.controlLabels.restore : cfg.controlLabels.max;
  }
  function toggleMax(w){
    morph(w, () => w.classList.toggle('max'));
    setMaxLabel(w);
  }

  // ---- タスクバー・Dock の状態 ----
  function updateBars(){
    const f = focused();
    if (cfg.taskbar){
      const t = document.querySelector(cfg.taskbar);
      t.replaceChildren();
      wins.forEach((w, id) => {
        const app = appById(id);
        const active = w === f;
        const b = el('button', 'task-btn' + (active ? ' active' : ''));
        b.type = 'button';
        b.dataset.app = id;
        b.setAttribute('aria-pressed', String(active));
        b.innerHTML = '<span class="task-ic">' + iconHtml(app) + '</span><span class="task-label"></span>';
        b.querySelector('.task-label').textContent = app.short;
        b.addEventListener('click', () => {
          if (active) minimize(id);
          else open(id);
        });
        t.appendChild(b);
      });
    }
    if (cfg.dock){
      document.querySelectorAll(cfg.dock + ' [data-dock]').forEach((b) => {
        const id = b.dataset.dock;
        b.classList.toggle('open', wins.has(id));
        b.classList.toggle('active', !!f && f.dataset.app === id);
      });
    }
    cfg.desktopEl.dataset.count = String(wins.size);
    if (cfg.onChange) cfg.onChange(wins, f);
  }

  function tickClock(){
    const d = new Date();
    const hm = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    document.querySelectorAll('[data-clock]').forEach((e) => { e.textContent = hm; });
    const date = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）';
    document.querySelectorAll('[data-date]').forEach((e) => { e.textContent = date; });
    const slash = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    document.querySelectorAll('[data-date-short]').forEach((e) => { e.textContent = slash; });
  }

  window.OS = { boot, open, close, minimize, iconHtml: (app) => iconHtml(app), pixelIcon, lineIcon, apps: P.apps };
})();
</script>
<script>
  OS.boot({
    icon: (app) => OS.lineIcon(app.kind),
    controls: ['min', 'max', 'close'],
    controlLabels: { min: '–', max: '□', restore: '❐', close: '×' },
    dock: '#dock',
    dockToggle: true,
    dockItem: (app) => OS.lineIcon(app.kind) + '<span class="tip">' + app.label + '</span>',
    anim: true,
    snap: true,
    marquee: true,
    contextMenu: [
      { label: 'ファイルを開く', open: 'files' },
      { label: 'はじめに.txt を開く', open: 'readme' },
      { label: '連絡先を開く', open: 'contact' },
      { sep: true },
      { label: '最新の情報に更新', action: 'refresh' }
    ]
  });

  // 起動の流れが終わったら、タスクバーのボタンから「ファイル」を開く（スマホでは開かない）
  if (!window.matchMedia('(max-width: 700px)').matches){
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const launch = () => OS.open('files', { x: .14, y: .05 }, document.querySelector('#dock [data-dock="files"]').getBoundingClientRect());
    if (reduce) launch(); else setTimeout(launch, 650);
  }
</script>
</body>
</html>
